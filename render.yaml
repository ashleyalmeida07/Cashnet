services:
  - type: web
    name: cashnet-backend
    runtime: python311
    region: oregon
    plan: free
    
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port 8000
    
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PORT
        value: 8000
    
    healthCheckPath: /health
    healthCheckInterval: 30
