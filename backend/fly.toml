# fly.toml file generated for cashnet-backend
app = "cashnet-backend"
primary_region = "ord"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [services.http_checks]
    enabled = true
    grace_period = "30s"
    interval = "15s"
    timeout = "4s"
    path = "/health"
